<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9 Months of Us ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e91e63; --gold: #ffd700; --text: #f5e6f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        /* 💖 HER PHOTO IS THE WALLPAPER ON ALL PAGES 💖 */
        body { background: #0b081a url('welcome.jpg') center/cover fixed no-repeat; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        /* Create a dreamy, romantic overlay */
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 8, 26, 0.6); backdrop-filter: blur(18px) brightness(0.9); z-index: -1; }
        
        .container { max-width: 450px; width: 100%; display: flex; flex-direction: column; gap: 25px; z-index: 10; }
        .glass { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(15px); border-radius: 24px; padding: 25px 20px; box-shadow: 0 15px 35px rgba(233, 30, 99, 0.1); animation: slideUp 0.8s ease-out forwards; opacity: 0; transform: translateY(30px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .hero { text-align: center; border: 1px solid rgba(233, 30, 99, 0.4); background: rgba(233, 30, 99, 0.1); box-shadow: 0 0 40px rgba(233, 30, 99, 0.2); }
        .hero h1 { font-size: 2.8rem; background: linear-gradient(135deg, #ff9a9e, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1); transition: transform 0.3s; }
        .gallery img:hover { transform: scale(1.05); }
        
        .music-box { display: flex; align-items: center; justify-content: space-between; }
        .play-btn { background: linear-gradient(135deg, var(--primary), #ff758f); border: none; padding: 8px 18px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(233, 30, 99, 0.5); }
        audio { width: 100%; margin-top: 10px; filter: invert(1) hue-rotate(180deg); }

        .nav-btn { display: block; text-align: center; background: linear-gradient(135deg, rgba(233, 30, 99, 0.3), rgba(255, 105, 180, 0.1)); border: 1px solid var(--primary); color: white; text-decoration: none; padding: 12px; border-radius: 15px; font-weight: bold; margin: 5px 0; transition: 0.3s; box-shadow: 0 0 15px rgba(233, 30, 99, 0.1); }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn.gold { background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05)); border-color: var(--gold); color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }

        /* Floating Hearts */
        .hearts-container { position: fixed; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; overflow: hidden; }
        .heart { position: absolute; bottom: -20px; font-size: 18px; animation: floatUp linear infinite; color: rgba(255, 105, 180, 0.4); }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; } 50% { opacity: 1; transform: scale(1.2); } 100% { transform: translateY(-120vh) rotate(360deg) scale(0.5); opacity: 0; } }
    </style>
</head>
<body>
    <div class="hearts-container" id="heartContainer"></div>
    <div class="container">
        <div class="glass hero">
            <h1>9 Months</h1>
            <p>Today we celebrate 9 months of us, Maki. ❤️</p>
        </div>
        <div class="glass music-box">
            <p>🎵 Our Song</p>
            <button class="play-btn" onclick="playMusic()">▶️ Play</button>
            <audio id="bgMusic" loop><source src="O_ዝ_ፀዳል_Ze_Tsedal_Track_14_Official_Lyrics_Video.m4a" type="audio/mp4"></audio>
        </div>
        <div class="glass">
            <h2>📸 Our Memories</h2>
            <div class="gallery">
                <img src="IMG_20260813_112923_570.jpg"> <img src="IMG_20260813_112936_333.jpg">
                <img src="IMG_20260813_112929_029.jpg"> <img src="IMG_20260510_221202_125.jpg">
                <img src="IMG_20260813_112823_055.jpg"> <img src="kejsls.jpg">
                <img src="IMG_20260813_112912_766.jpg"> <img src="bet.jpg">
            </div>
        </div>
        <div class="glass">
            <a href="love.html" class="nav-btn">💖 Go to My Love Letter & Quiz</a>
            <a href="surprise.html" class="nav-btn gold">🎉 Open the Final Surprise</a>
        </div>
    </div>
    <script>
        function createHeart() {
            const h = document.createElement('div'); h.className = 'heart';
            h.innerHTML = ['❤️','💖','💕','💗','❤️‍🔥'][Math.floor(Math.random()*5)];
            h.style.left = Math.random() * 100 + '%';
            h.style.animationDuration = (Math.random() * 8 + 4) + 's';
            h.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.getElementById('heartContainer').appendChild(h);
            setTimeout(() => h.remove(), 12000);
        }
        setInterval(createHeart, 500);
        function playMusic() {
            const audio = document.getElementById('bgMusic');
            if (audio.paused) { audio.play(); } else { audio.pause(); }
        }
    </script>
</body>
</html>
